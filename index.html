<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ariel's Favorite Food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: one centered quiz card on a checkered-tablecloth backdrop */
:root {
  --bg: #fdf3e7;
  --check: #f6dccb;
  --card: #ffffff;
  --fg: #2b211c;
  --muted: #7a685d;
  --accent: #d6452f;
  --good: #2f8f4e;
  --good-bg: #e3f4e8;
  --bad: #b5372a;
  --bad-bg: #fbe4e0;
  --line: #ead8c8;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1915; --check: #2a221d; --card: #2c2420; --fg: #f5ebe2; --muted: #b9a89b;
    --accent: #ff7a5c; --good: #6fd28f; --good-bg: #1f3a28; --bad: #ff8a7a; --bad-bg: #42231f; --line: #43362e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1915; --check: #2a221d; --card: #2c2420; --fg: #f5ebe2; --muted: #b9a89b;
  --accent: #ff7a5c; --good: #6fd28f; --good-bg: #1f3a28; --bad: #ff8a7a; --bad-bg: #42231f; --line: #43362e;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%),
    linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%);
  background-size: 48px 48px;
  background-position: 0 0, 24px 24px;
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px;
  display: grid;
  place-items: start center;
}
.card {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 28px 24px;
  display: grid;
  gap: 20px;
  box-shadow: 0 10px 30px rgba(60, 30, 10, 0.12);
}
.eyebrow {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); font-weight: 700; margin: 0;
}
h1 {
  font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.15;
  margin: 0; text-wrap: balance;
}
h1 span { color: var(--accent); }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  font: 700 17px var(--body); color: var(--fg);
  background: var(--card); border: 2px solid var(--line); border-radius: 14px;
  padding: 14px 16px; cursor: pointer;
  transition: border-color .15s, transform .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .emoji { font-size: 26px; line-height: 1; }
.opt .mark { margin-left: auto; font-size: 18px; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .5; }
.result {
  font-family: var(--display); font-size: 20px; font-weight: 500;
  margin: 0; min-height: 1.4em;
}
.result.good { color: var(--good); }
.result.bad { color: var(--bad); }
.again {
  justify-self: start;
  font: 700 15px var(--body); color: #fff; background: var(--accent);
  border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
}
.again:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
.opt.correct { animation: pop .35s ease; }
@media (prefers-reduced-motion: reduce) { .opt, .opt.correct { transition: none; animation: none; } }
[hidden] { display: none !important; }
body { margin: 0; }
.card { box-sizing: border-box; }
</style>
</head>
<body>

<main class="card">
  <p class="eyebrow">Quick quiz · 1 question</p>
  <h1>What is Ariel's <span>favorite food</span>?</h1>
  <div class="options" id="options"></div>
  <p class="result" id="result" aria-live="polite">Pick one.</p>
  <button class="again" id="again" hidden>Try again</button>
</main>

<script>
const choices = [
  { id: "sushi", label: "Sushi", emoji: "🍣" },
  { id: "pizza", label: "Pizza", emoji: "🍕" },
  { id: "hummus", label: "Hummus", emoji: "🥙" },
  { id: "burger", label: "Burger", emoji: "🍔" },
];
const ANSWER = "pizza";
const box = document.getElementById("options");
const result = document.getElementById("result");
const again = document.getElementById("again");

function render() {
  box.innerHTML = "";
  result.textContent = "Pick one.";
  result.className = "result";
  again.hidden = true;
  choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "opt";
    b.id = "opt-" + c.id;
    b.innerHTML = `<span class="emoji" aria-hidden="true">${c.emoji}</span><span>${c.label}</span><span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => pick(c.id));
    box.appendChild(b);
  });
}

function pick(id) {
  const right = id === ANSWER;
  box.querySelectorAll(".opt").forEach(b => {
    const bid = b.id.slice(4);
    b.disabled = true;
    if (bid === ANSWER) { b.classList.add("correct"); b.querySelector(".mark").textContent = "✓"; }
    else if (bid === id) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✗"; }
    else b.classList.add("dim");
  });
  if (right) {
    result.textContent = "Correct! Ariel loves pizza.";
    result.className = "result good";
  } else {
    result.textContent = "Nope. Ariel's favorite is pizza.";
    result.className = "result bad";
  }
  again.hidden = false;
}

again.addEventListener("click", render);
render();
</script>
</body>
</html>
